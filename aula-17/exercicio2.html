<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Document</title>
    <script src="exercicio2.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <div class="navbar-collapse" id="navbarTogglerDemo01">
            <a class="navbar-brand" href="#">Minha loja</a>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Cadastro</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Produto</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Carrinho</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Endereço</h1>
        <div class="row">
            <div class="col-6">
                <div class="col form-floating">
                    <input id="cep" type="text" class="form-control" placeholder="CEP">
                    <label for="cep">CEP</label>
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button id="buscar" class="btn btn-primary col-12 mt-2">Cadastrar</button>
                </div>
            </div>
            <div class="col-6">
                <div class="col form-floating">
                    <input id="cidade" type="text" class="form-control" placeholder="Cidade" disabled>
                    <label for="cidade">Cidade</label>
                </div>
                <div class="col form-floating mt-4">
                    <input id="rua" type="text" class="form-control" placeholder="Rua" disabled>
                    <label for="rua">Rua</label>
                </div>
                <div class="col form-floating mt-4">
                    <input id="bairro" type="text" class="form-control" placeholder="Bairro" disabled>
                    <label for="bairro">Bairro</label>
                </div>
                <div class="col form-floating mt-4">
                    <input id="estado" type="text" class="form-control" placeholder="Estado" disabled>
                    <label for="estado">Estado</label>
                </div>
            </div>
        </div>
    </div>
